analysis_options:
 skip_trimming: False
 skip_qualimap: False
 skip_kraken_screening: False
 skip_decontamination: False #only relevant if you have a contamination fasta file
 integrate_short_reads: True
 search_for_antibiotic_resistence: True


# Sheet with paths to the samples
samples_short_read: "config/samples_short.tsv"
samples_long_read: "config/samples_long.tsv"


#screening + decontamination, this is optional, controlled in config analysis options
kraken2_db: "resources/kraken2_db" #to be downloaded for the kraken2 screening
contamination_fasta: [] #for the decontamination, also need skip_decontamination to be set to False in the analysis options section above


#optional and controlled from here itself
external_genome: [] #this is the outgroup assembled genome, as a fasta file



#DOWNSTREAM ANALYSIS

#for the antibiotic resistance, this is optional, controlled in config analysis options
card_db: "resources/card_db" #to be downloaded
card_version: "4.0.1"  # Pin the exact version for scientific reproducibility

#for the protein phylogeny, this is optional, controlled from here itself
diamond_db: "resources/diamond_db/protein_pool"
protein_sequences: [] #this is optional


flye_technique: "--pacbio-raw" #mention the technique you would like to use for the assembly
busco_lineage: "enterobacterales_odb12" #mention the lineage you would like to use for the busco completeness analysis

